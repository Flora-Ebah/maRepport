# Frontend service — build context is frontend/ (matches docker-compose setup).
# Set NEXT_PUBLIC_API_URL in the Railway service variables before deploying;
# Railway passes service env vars as Docker build args automatically.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
